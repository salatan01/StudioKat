<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A launch invitation</title>
<style>
  html, body { margin: 0; background: #060504; overflow: hidden; }
  canvas#c { display: block; }

  /* Faces come from the pinned OFL manifest
     (.agents/skills/lemo/library/assets/fonts/manifest.json); the render
     server root is library/, so the URL is absolute from there. */
  @font-face {
    font-family: 'Limelight';
    src: url('/assets/fonts/limelight/Limelight-Regular.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Poiret';
    src: url('/assets/fonts/poiretone/PoiretOne-Regular.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Josefin';
    src: url('/assets/fonts/josefinsans/JosefinSans[wght].ttf') format('truetype');
    font-style: normal;
    font-weight: 100 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Italiana';
    src: url('/assets/fonts/italiana/Italiana-Regular.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
  }
</style>
</head>
<body>
  <canvas id="c" width="1920" height="1080"></canvas>
  <script type="module" src="clip.js"></script>
</body>
</html>
