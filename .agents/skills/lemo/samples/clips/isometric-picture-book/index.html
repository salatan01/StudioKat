    font-weight: 200 800;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'NotoSerifSC';
    src: url('/assets/fonts/notoserifsc/NotoSerifSC[wght].ttf') format('truetype');
    font-weight: 200 900;
    font-style: normal;
    font-display: block;
  }
</style>
