<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lighthouse opens</title>
<style>
  html, body { margin: 0; background: #241a14; overflow: hidden; }
  canvas { display: block; }

  /* Faces come from the pinned OFL manifest
     (.agents/skills/lemo/library/assets/fonts/manifest.json); the render
     server root is library/, so the URL is absolute from there. Only the
     face this clip actually draws is declared: IM Fell English roman
     (IMFeENrm28P.ttf), the storybook serif the page title is set in. */
  @font-face {
    font-family: 'IM Fell English';
    src: url('/assets/fonts/imfellenglish/IMFeENrm28P.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
</style>
</head>
<body>
  <canvas id="c" width="1920" height="1080"></canvas>
  <script type="module" src="clip.js"></script>
</body>
</html>
