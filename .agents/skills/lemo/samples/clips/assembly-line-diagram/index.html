<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From cocoa pod to chocolate bar</title>
<style>
  html, body { margin: 0; background: #F2ECE0; overflow: hidden; }
  canvas { display: block; }

  /* Faces come from the pinned OFL manifest
     (.agents/skills/lemo/library/assets/fonts/manifest.json); the render
     server root is library/, so the URL is absolute from there. */
  @font-face {
    font-family: 'Big Shoulders Display';
    src: url('/assets/fonts/bigshouldersdisplay/BigShouldersDisplay[wght].ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Archivo';
    src: url('/assets/fonts/archivo/Archivo[wdth,wght].ttf') format('truetype');
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-style: normal;
    font-display: block;
  }
</style>
</head>
<body>
  <canvas id="c" width="1920" height="1080"></canvas>
  <script type="module" src="clip.js"></script>
</body>
</html>
