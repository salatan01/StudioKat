name: editor
version: "1.0"
description: >
  Vendored AI video editor pipeline (`.agents/skills/ai-video-editor`) for raw talking-head
  footage: local-Whisper transcription, transcript-aware cutting of silences and mistakes,
  motion graphics in one of seven canvas styles (16:9/9:16/3:4), optional captions and
  sound effects, and a rendered MP4. English and Bangla. Output is
  projects/<id>/renders/final.mp4.
category: talking_head
stability: production
default_checkpoint_policy: guided

required_skills:
  - pipelines/editor/idea-director
  - pipelines/editor/script-director
  - pipelines/editor/scene_plan-director
  - pipelines/editor/asset-director
  - pipelines/editor/edit-director
  - pipelines/editor/compose-director
  - meta/reviewer
  - meta/checkpoint-protocol

extensions:
  custom_scripts: false
  custom_playbooks: false
  custom_skills: false
  custom_tools: false

stages:
  - name: idea
    skill: pipelines/editor/idea-director
    produces:
      - brief
      - style_lock
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Style lock matches the user's chosen style, engine, and contract
      - Source footage is linked in the brief (reference_material)
      - Target platform matches the chosen ratio (16:9 → youtube; 9:16 → instagram; 3:4 → instagram)
      - Target duration is realistic for the footage length
      - Language support covers the user's language choice
      - decision_log records style_selection, ratio_selection, language_selection
    success_criteria:
      - Schema-valid brief and style_lock artifacts
      - style_lock.source paths exist under .agents/skills/ai-video-editor/styles/<id>/
      - Style contract was played back to the user before approval

  - name: script
    skill: pipelines/editor/script-director
    required_artifacts_in:
      - brief
    produces:
      - script
    required_tools:
      - editor_render
    tools_available:
      - editor_render
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Transcription is accurate at the word level (spot-check key sections)
      - Script sections have valid timestamps from transcript data
      - Transcript duration matches the footage duration
    success_criteria:
      - Schema-valid script artifact
      - Word count and duration match transcript.json

  - name: scene_plan
    skill: pipelines/editor/scene_plan-director
    required_artifacts_in:
      - script
    produces:
      - scene_plan
    required_tools:
      - editor_render
    tools_available:
      - editor_render
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Beat list is approved by the user (gates the plan)
      - Beats time code on the RAW transcript; edit stage re-times after the cut
      - Beats skip pauses where words would be spoken
      - No beat overlaps the opening/closing silent stretches
    success_criteria:
      - Schema-valid scene_plan artifact
      - Beats cover the script sections the user wants visuals for
      - User approved the beat list

  - name: assets
    skill: pipelines/editor/asset-director
    required_artifacts_in:
      - scene_plan
    produces:
      - asset_manifest
    required_tools:
      - editor_render
    tools_available:
      - editor_render
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Mistake cuts shown to the user and approved (edits.json)
      - cut.mp4 duration and frame count are plausible for the plan
      - transcript_edited.json times on the edited video look right
      - Style and ratio recorded in the manifest metadata
    success_criteria:
      - Schema-valid asset_manifest artifact
      - cut.mp4 exists at projects/<id>/editor/cut.mp4
      - transcript_edited.json matches the approved cuts

  - name: edit
    skill: pipelines/editor/edit-director
    required_artifacts_in:
      - asset_manifest
    produces:
      - edit_decisions
    required_tools:
      - editor_render
    tools_available:
      - editor_render
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - story.js renders cleanly (editor_render story --check)
      - SPANS and D match the asset_manifest beat plan and cut_seconds
      - render_runtime is "editor"; style/ratio locked from idea
    success_criteria:
      - Schema-valid edit_decisions artifact
      - edit_decisions.render_runtime == "editor"
      - Story duration matches asset_manifest cut_seconds

  - name: compose
    skill: pipelines/editor/compose-director
    required_artifacts_in:
      - edit_decisions
    produces:
      - render_report
      - final_review
    required_tools:
      - editor_render
      - visual_qa
    tools_available:
      - editor_render
      - visual_qa
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - final.mp4 exists and plays; duration matches edit_decisions
      - Contact sheet read in full; key frames inspected at full size
      - render_report.metadata.editor_qa names the contact sheet and inspected frames
      - Audio checked with objective loudness/peak/alignment measurements
      - final_review promise_preservation.render_runtime_used == "editor"
    success_criteria:
      - Schema-valid render_report with metadata.editor_qa
      - Schema-valid final_review; render_runtime_used == "editor"
      - Output is projects/<id>/renders/final.mp4, has an audio stream, and probe passes
      - Contact sheet and at least four key frames exist under review/
